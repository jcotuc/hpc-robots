<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon de Robots HPC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b12; --panel:#17131f; --line:#2c2438; --text:#e9e3f2; --muted:#9a8fae;
  --ok:#4ade80; --wait:#60a5fa; --err:#f87171; --dead:#6b6475; --gold:#f5c542;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px;border-bottom:2px solid var(--line);background:linear-gradient(#1b1525,#120e18)}
h1{font-family:"Press Start 2P",monospace;font-size:16px;margin:0;color:var(--gold);letter-spacing:1px}
.sub{font-size:12px;color:var(--muted);margin-top:6px}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{background:var(--panel);border:2px solid var(--line);padding:8px 12px;font-family:"Press Start 2P",monospace;font-size:10px;display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;display:inline-block;flex:none}
.tools{display:flex;gap:8px;align-items:center}
button{font-family:"Press Start 2P",monospace;font-size:9px;background:var(--panel);color:var(--text);border:2px solid var(--line);padding:8px 10px;cursor:pointer}
button:hover{border-color:var(--gold)}
button.on{border-color:var(--ok);color:var(--ok)}
.demo{font-family:"Press Start 2P",monospace;font-size:9px;color:#111;background:var(--gold);padding:6px 8px}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:12px}
.izq{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.mapa{background:#07060a;border:2px solid var(--line);line-height:0;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;flex:1}
.niveles{display:flex;flex-wrap:wrap;gap:6px}
.nivel{display:flex;align-items:center;gap:6px;font-size:9px;padding:6px 8px}
.nivel.activo{border-color:var(--gold);color:var(--gold)}
.nivel.vacio{opacity:.4;cursor:default}
.nivel.vacio:hover{border-color:var(--line)}
.luces{display:flex;gap:2px}
.luces i{width:6px;height:6px;display:block}
.centro-tag{font-size:11px;color:var(--muted)}
.tip{position:fixed;z-index:10;pointer-events:none;background:#0f0c15;border:2px solid var(--gold);padding:8px 10px;font-size:12px;max-width:300px;display:grid;gap:3px;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.tip b.n{font-family:"Press Start 2P",monospace;font-size:9px}
.tip .l{display:flex;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mapa{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.lateral{display:flex;flex-direction:column;gap:12px;min-height:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;align-content:start}
.card{background:var(--panel);border:2px solid var(--line);padding:8px 10px;display:grid;gap:4px;scroll-margin:8px}
/* Escritorio: todo cabe en la pantalla, sin scroll de página */
@media (min-width:981px){
  html,body{height:100%}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{padding:10px 16px}
  main{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr)}
  .cards{grid-template-columns:1fr;overflow-y:auto;overflow-x:hidden;flex:0 0 auto;max-height:72%;padding-right:2px;gap:6px}
  .card{padding:6px 10px;gap:3px}
  .lateral aside h2{padding:8px 12px}
  .lateral aside{flex:1 1 0;min-height:120px;max-height:none;position:static}
}
.card.error{border-color:var(--err);animation:pulse 1s infinite}
.card.caido{border-color:#3a3442}
.card.foco{outline:2px solid var(--gold)}
@keyframes pulse{50%{box-shadow:0 0 18px rgba(248,113,113,.55)}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-family:"Press Start 2P",monospace;font-size:11px}
.badge{font-family:"Press Start 2P",monospace;font-size:8px;padding:5px 6px;color:#111}
.meta{font-size:12px;color:var(--muted)}
.det{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err-txt{font-size:11px;color:var(--err);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:12px;font-size:12px}
.stats b{font-family:"Press Start 2P",monospace;font-size:10px}
.areas{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:6px}
.area{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px}
.area b{font-weight:600}
.area .meta{margin-left:auto}
.tag{font-family:"Press Start 2P",monospace;font-size:7px;padding:2px 4px;color:#111;margin-left:4px}
aside{background:var(--panel);border:2px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside h2{font-family:"Press Start 2P",monospace;font-size:10px;margin:0;padding:12px;border-bottom:2px solid var(--line);color:var(--gold)}
#log{overflow:auto;padding:8px 12px;display:grid;gap:6px;font-size:12px}
.ev{display:grid;grid-template-columns:52px 1fr;gap:6px;border-bottom:1px solid var(--line);padding-bottom:6px}
.ev time{color:var(--muted);font-variant-numeric:tabular-nums}
.ev .t-ok{color:var(--ok)} .ev .t-error{color:var(--err)} .ev .t-info{color:var(--wait)}
.empty{color:var(--muted);font-size:12px;padding:8px 0}
@media (max-width:980px){aside{max-height:420px}}
@media (max-width:480px){header{padding:12px 16px}h1{font-size:12px}main{padding:12px 16px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>DUNGEON DE ROBOTS</h1>
    <div class="sub" id="sub">HPC · Centros de Servicio</div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="tools">
    <span class="demo" id="demoTag" hidden>MODO DEMO</span>
    <button id="snd" title="Alarma en errores y caídos, campanita en cada OK">SONIDO: OFF</button>
  </div>
</header>
<main>
  <div class="izq">
    <nav class="niveles" id="niveles" aria-label="Centros de servicio"></nav>
    <div class="tip" id="tip" hidden></div>
    <div class="mapa" id="mapaBox"><canvas id="mapa" aria-label="Mapa del dungeon con un cuarto por robot"></canvas></div>
  </div>
  <div class="lateral">
    <div class="cards" id="cards"></div>
    <aside><h2>BITÁCORA EN VIVO</h2><div id="log"><div class="empty">Sin eventos todavía</div></div></aside>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ================== CONFIG ==================
   Deja vacío para MODO DEMO. Usa la ANON key (solo lectura por RLS). ?demo en la URL = datos simulados */
const SUPABASE_URL = 'https://kkzovradqpptmsaakqlb.supabase.co'; // proyecto de citas / MiMo
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtrem92cmFkcXBwdG1zYWFrcWxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NDEyMjMsImV4cCI6MjA5ODQxNzIyM30.-An3ySZYgSErKSTvfrui6BKrbEUcp-BgmloR7QsaRN4'; // Supabase → Project Settings → API → anon public

/* Robots esperados: si uno nunca reporta, aparece "SIN DATOS". id = el que usa crearMonitor("id")
   horario = el de su tarea programada (programar-tarea.cmd), hora Guatemala. Fuera de horario = DURMIENDO, no CAÍDO
   sala    = qué escena se dibuja: 'logistica' | 'digitacion' | 'recepcion' | 'correo' | (otra = escritorio genérico)
   areas   = puestos dentro del cuarto. Se reconocen por texto en lo que reporta el robot (tipos);
             el que tenga defecto:true recibe lo que no coincida con ninguno.                                   */
/* Centros de servicio = niveles del dungeon. id = lo que el robot reporta en ROBOT_CENTRO (o el centro por defecto del robot) */
const CENTROS = [
  { id: 'Nodus', nombre: 'Nodus · Z6' }, { id: 'Zona 4', nombre: 'Zona 4' },
  { id: 'Chimaltenango', nombre: 'Chimaltenango' }, { id: 'Quiché', nombre: 'Quiché' }, { id: 'Escuintla', nombre: 'Escuintla' },
  { id: 'Río Hondo', nombre: 'Río Hondo' }, { id: 'Xela', nombre: 'Xela' }, { id: 'Cobán', nombre: 'Cobán' },
  { id: 'Huehuetenango', nombre: 'Huehuetenango' }, { id: 'Mazatenango', nombre: 'Mazatenango' }, { id: 'Petén', nombre: 'Petén' },
  { id: 'Jutiapa', nombre: 'Jutiapa' }, { id: 'El Rancho', nombre: 'El Rancho' }, { id: 'Morales', nombre: 'Morales' },
];
const COMUN = 'Común';   // robots que atienden a todos los centros (hoy ninguno)
const LS = [1, 2, 3, 4, 5, 6]; // lunes a sábado
const ROBOTS = [
  /* El Jefe: revisa a los demás (jefe/revisar.mjs). global = su oficina sale en todos los niveles */
  { id: 'jefe',        nombre: 'Jefe',        sala: 'jefatura',   global: true,     color: '#f59e0b', horario: { dias: LS, desde: '06:00', hasta: '21:00' } },
  { id: 'citas',       nombre: 'Citas',       sala: 'recepcion',  centro: 'Zona 4', color: '#f5c542', horario: { dias: LS, desde: '05:55', hasta: '20:25' } },
  /* Guías puede correr en varios centros: cada PC pone ROBOT_CENTRO en su .env (ver monitor/03_centros.sql); sin eso = Nodus */
  { id: 'guias',       nombre: 'Guías',       sala: 'logistica',  centro: 'Nodus',  color: '#60a5fa', horario: { dias: LS, desde: '07:00', hasta: '20:00' } },
  { id: 'digitadores', nombre: 'Digitadores', sala: 'digitacion', centro: 'Nodus',  color: '#2dd4bf', horario: { dias: LS, desde: '07:00', hasta: '18:00' },
    /* Un puesto por estado de llamada. Para agregar otro: { id, nombre, rotulo, color, tipos: /texto/i } */
    areas: [
      { id: 'garantia', nombre: 'Garantía', rotulo: 'GARANTIA', color: '#2dd4bf', tipos: /garant/i, defecto: true },
    ] },
  { id: 'correos',     nombre: 'Correos',     sala: 'correo',     centro: 'Nodus',  color: '#f472b6', horario: { dias: LS, desde: '07:00', hasta: '20:00' },
    /* Departamentos: se reconocen por el tipo de correo (correos_cola.tipo) */
    areas: [
      { id: 'autoconsumos', nombre: 'Autoconsumos',   rotulo: 'AUTOCONSUMOS', color: '#fbbf24', tipos: /\bautoconsumo/ },
      { id: 'garantias',    nombre: 'Garantías / NC', rotulo: 'GARANTIA/NC',  color: '#38bdf8', tipos: /\b(garantia|nc)_/ },
    ] },
  // { id: 'mimo', nombre: 'MiMo', sala: 'recepcion', color: '#fb923c', horario: { dias: LS, desde: '05:55', hasta: '20:25' } },
];
/* Flujos reales entre robots: la misma llamada pasa de un robot al otro.
   cuando = texto en el reporte OK del robot origen que indica que la mandó (ej. "· logística") */
const FLUJOS = [
  { de: 'digitadores', a: 'guias', cuando: /log[ií]stica/i, etiqueta: 'A LOGÍSTICA' },
];
const GRACIA_SEG = 90; // margen extra antes de declarar "caído" (intervalo*2 + gracia)
/* ============================================ */

const ESTADOS = {
  trabajando: { txt: 'TRABAJANDO', c: 'var(--ok)'   },
  esperando:  { txt: 'ESPERANDO',  c: 'var(--wait)' },
  durmiendo:  { txt: 'DURMIENDO',  c: '#a78bfa'     },
  error:      { txt: 'ERROR',      c: 'var(--err)'  },
  caido:      { txt: 'CAÍDO',      c: 'var(--dead)' },
  sindatos:   { txt: 'SIN DATOS',  c: 'var(--dead)' },
};
const DEMO = !SUPABASE_URL || !SUPABASE_ANON_KEY || new URLSearchParams(location.search).has('demo');
const status = new Map();    // robot|pc -> fila
const resumen = new Map();   // robot|pc -> {ok_hoy, errores_hoy}
const areaStats = new Map(); // robot|pc|area -> {ok, err, reint, ultimo}
const ultimoOk = new Map();  // robot|pc -> fecha del último OK (para animar "recién terminado")
let eventos = [];
let hallazgos = [];          // jefe_hallazgos abiertos
const viajes = [];           // mensajeros caminando por los corredores
const aviones = [];          // correos enviados (avioncitos de papel)
const festejos = new Map();  // cuarto -> momento en que el jefe cerró su hallazgo
let campana = 0;             // momento del último hallazgo nuevo
let reaccion = null;         // reacción del Jefe a algo que acaba de pasar: { tipo: 'orden'|'resuelto'|'nuevo', t0, txt }
function reaccionar(tipo, txt = '') { reaccion = { tipo, t0: performance.now(), txt }; }
const DUR_REACCION = { orden: 3600, resuelto: 3200, nuevo: 2400 };
const flujo = new Map();     // llamada -> { de, pc, a, at, impresa }  (lo que va de un robot a otro)
let jefeVa = null, jefeDesde = 0, jefeAntes = null;   // cuarto al que fue el jefe (y de dónde venía)

const key = (r, pc) => `${r}|${pc}`;
const meta = id => ROBOTS.find(r => r.id === id) || { id, nombre: id, color: '#e9e3f2' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hhmm = ts => new Date(ts).toLocaleTimeString('es-GT', { hour: '2-digit', minute: '2-digit', hour12: false });
function hace(ts) {
  if (!ts) return '—';
  const s = Math.max(0, Math.round((Date.now() - new Date(ts).getTime()) / 1000));
  if (s < 60) return `hace ${s}s`;
  if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
  if (s < 86400) return `hace ${Math.floor(s / 3600)} h`;
  return `hace ${Math.floor(s / 86400)} d`;
}
const inicioDiaGT = () => { const f = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Guatemala' }); return new Date(f + 'T00:00:00-06:00').toISOString(); };

/* ---------- Estado efectivo ---------- */
function minEnHorario(id) {
  const h = meta(id).horario; if (!h) return 9999;
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Guatemala', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  const dia = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(p.weekday);
  const min = (+p.hour % 24) * 60 + +p.minute, aMin = t => +t.slice(0, 2) * 60 + +t.slice(3);
  return h.dias.includes(dia) && min >= aMin(h.desde) && min <= aMin(h.hasta) ? min - aMin(h.desde) : null;
}
function estadoEfectivo(s, id) {
  const m = minEnHorario(id || s?.robot);
  if (!s) return m === null ? 'durmiendo' : 'sindatos';
  const limite = (s.intervalo_seg || 180) * 2 + GRACIA_SEG;
  const edad = (Date.now() - new Date(s.last_seen).getTime()) / 1000;
  if (edad <= limite) return s.estado;
  if (m === null || m * 60 < limite) return 'durmiendo';
  return 'caido';
}

/* ---------- Áreas (departamentos / estados) ---------- */
function areaDe(robotId, texto) {
  const a = meta(robotId).areas; if (!a) return null;
  return (texto && a.find(x => x.tipos.test(String(texto)))) || a.find(x => x.defecto) || null;
}
function contarEvento(ev, enVivo = false) {
  if (ev.tipo === 'ok') { const k = key(ev.robot, ev.pc); if (!ultimoOk.get(k) || ev.created_at > ultimoOk.get(k)) ultimoOk.set(k, ev.created_at); }
  if (ev.tipo === 'ok' && ev.llamada) {
    const L = String(ev.llamada).toUpperCase();
    FLUJOS.forEach(f => {
      if (ev.robot === f.de && f.cuando.test(ev.mensaje || '')) {
        if (!flujo.has(L)) flujo.set(L, { de: f.de, pc: ev.pc, a: f.a, at: ev.created_at, impresa: false, etiqueta: f.etiqueta });
        if (enVivo) mandarMensajero(key(ev.robot, ev.pc), f.a, L, meta(f.de).color);
      }
      if (ev.robot === f.a && flujo.get(L)?.de === f.de) flujo.get(L).impresa = true;
    });
  }
  if (enVivo && ev.tipo === 'ok' && !ev._soloFlujo && meta(ev.robot).sala === 'correo') lanzarAvion(key(ev.robot, ev.pc), areaDe(ev.robot, ev.mensaje));
  if (ev._soloFlujo) return;
  const ar = areaDe(ev.robot, ev.mensaje); if (!ar) return;
  const k = `${ev.robot}|${ev.pc}|${ar.id}`;
  const x = areaStats.get(k) || { ok: 0, err: 0, reint: 0, ultimo: null };
  if (ev.tipo === 'ok') { x.ok++; if (!x.ultimo || ev.created_at > x.ultimo) x.ultimo = ev.created_at; }
  else if (ev.tipo === 'error') x.err++;
  else x.reint++;
  areaStats.set(k, x);
}

/* =====================================================================
   MAPA: cuartos conectados por corredores (coordenadas lógicas en píxeles)
   ===================================================================== */
const RW = 184, RH = 120, G = 30, M = 18;
const cv = document.getElementById('mapa'), ctx = cv.getContext('2d');
let S = 3, MW = 0, MH = 0, cols = 1, fondo = null, antorchas = [];
const cuartos = new Map(); // robot|pc -> {k, x, y, fase}

function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function texto(t, x, y, size, color, centro = false) {
  ctx.font = `${size}px "Press Start 2P", monospace`; ctx.fillStyle = color;
  ctx.fillText(t, Math.round(centro ? x - ctx.measureText(t).width / 2 : x), Math.round(y));
}
function rnd(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

/* Centro de un cuarto: el que reporta el robot (ROBOT_CENTRO) o el de su config */
const centroDe = k => status.get(k)?.centro || meta(k.split('|')[0]).centro || COMUN;
let nivel = 'todos';
try { nivel = new URLSearchParams(location.search).get('centro') || localStorage.getItem('dungeon-nivel') || 'todos'; } catch {}
function todasLasKeys() {
  const ks = new Set([...status.keys()].filter(k => ROBOTS.some(r => r.id === k.split('|')[0])));
  ROBOTS.forEach(r => { if (![...ks].some(k => k.startsWith(r.id + '|'))) ks.add(key(r.id, '—')); });
  const orden = id => ROBOTS.findIndex(r => r.id === id);
  return [...ks].sort((a, b) => orden(a.split('|')[0]) - orden(b.split('|')[0]) || a.localeCompare(b));
}
const esGlobal = k => !!meta(k.split('|')[0]).global;
function allKeys() {
  const ks = todasLasKeys();
  if (nivel === 'todos' || !ks.some(k => !esGlobal(k) && centroDe(k) === nivel)) return ks;
  return ks.filter(k => esGlobal(k) || centroDe(k) === nivel);
}
function elegirNivel(n) {
  nivel = n; try { localStorage.setItem('dungeon-nivel', n); } catch {}
  ultimaFirma = ''; quizasLayout(); renderCards(); renderLog();
}
function renderNiveles() {
  const ks = todasLasKeys(), por = {};
  ks.filter(k => !esGlobal(k)).forEach(k => (por[centroDe(k)] ||= []).push(estadoEfectivo(status.get(k), k.split('|')[0])));
  const luces = l => `<span class="luces">${(l || []).map(e => `<i style="background:${ESTADOS[e].c}"></i>`).join('')}</span>`;
  const chip = (id, nombre, l) => l?.length
    ? `<button class="nivel ${nivel === id ? 'activo' : ''}" data-n="${esc(id)}">${esc(nombre)} ${luces(l)}</button>`
    : `<button class="nivel vacio" disabled title="Sin robots todavía">${esc(nombre)}</button>`;
  const todos = Object.values(por).flat();
  const nav = document.getElementById('niveles');
  nav.innerHTML = chip('todos', 'TODOS', todos)
    + CENTROS.map(c => chip(c.id, c.nombre, por[c.id])).join('')
    + (por[COMUN] ? chip(COMUN, COMUN.toUpperCase(), por[COMUN]) : '')
    + Object.keys(por).filter(c => c !== COMUN && !CENTROS.some(x => x.id === c)).map(c => chip(c, c, por[c])).join('');
  nav.querySelectorAll('button[data-n]').forEach(b => b.onclick = () => elegirNivel(b.dataset.n));
}

function layout() {
  const keys = allKeys();
  const box = document.getElementById('mapaBox'), n = keys.length;
  const cw = (box.clientWidth || 800) - 4;
  const ch = pantallaCompleta.matches ? (box.clientHeight || 600) - 4 : Infinity;   // celular: solo el ancho manda
  const medir = celdas => {
    const c0 = Math.min(...celdas.map(x => x.c)), r0 = Math.min(...celdas.map(x => x.r));
    const cs = Math.max(...celdas.map(x => x.c)) - c0 + 1, rs = Math.max(...celdas.map(x => x.r)) - r0 + 1;
    const w = 2 * M + cs * RW + (cs - 1) * G, h = 2 * M + rs * RH + (rs - 1) * G;
    return { celdas: celdas.map(x => ({ ...x, c: x.c - c0, r: x.r - r0 })), cols: cs, rows: rs, w, h, esc: Math.min(cw / w, ch / h) };
  };
  const opciones = [];
  const jk = keys.find(esGlobal), otros = keys.filter(k => k !== jk);
  if (jk && otros.length <= 8 && cw >= 560) {
    // Jefe al centro (fila 1, columna 1); alrededor: primero los lados, luego las esquinas

}

/* Recorre una lista de pasos en bucle: {ir:[x,y], ms} camina · {hacer:'nombre', ms} se queda */
function ruta(t, inicio, pasos) {
  const total = pasos.reduce((a, p) => a + p.ms, 0);
  let tt = t % total, pos = inicio;
  for (const p of pasos) {
    if (tt < p.ms) {
      const f = tt / p.ms;
      if (p.ir) return { x: pos[0] + (p.ir[0] - pos[0]) * f, y: pos[1] + (p.ir[1] - pos[1]) * f, accion: 'camina', f, carga: p.carga, mira: Math.sign(p.ir[0] - pos[0]) || 1 };
      return { x: pos[0], y: pos[1], accion: p.hacer, f, carga: p.carga, mira: 1 };
    }
    tt -= p.ms; if (p.ir) pos = p.ir;
  }
  return { x: pos[0], y: pos[1], accion: 'pie', f: 0 };
}

  px(62, 70, 12, 6, '#f9fafb'); px(63, 71, 10, 1, '#9ca3af'); px(112, 66, 14, 10, '#1f2937'); px(114, 68, 10, 6, hallazgos.length ? '#7f1d1d' : '#14532d');

  if (d) {    // de pie junto a la puerta del cuarto con problema, señalando con aura
    const dx = d.x - q.x, dy = d.y - q.y;

    const P = { izq: [34, 112, Math.PI], der: [152, 112, 0], arriba: [150, 74, -Math.PI / 2], abajo: [C + 30, 114, Math.PI / 2] }[lado];
    const [x, y, ang] = P, pisoton = alta ? Math.floor(t / 220) % 2 : 0;

    const avance = (t / 120) % 3;
    for (let i = 0; i < 4; i++) { const r = 26 + i * 4 + avance; px(x + Math.cos(ang) * r - 1, y - 26 + Math.sin(ang) * r - 1, 3, 3, i === 3 ? '#fde047' : '#f59e0b'); }
    const nombre = meta(jefeVa.split('|')[0]).nombre.toUpperCase();

    globo(x, y - ALTO_JEFE - 4, (t % 3600) < 2400 ? (lado === 'izq' ? '← ' + nombre : lado === 'der' ? nombre + ' →' : lado === 'arriba' ? '↑ ' + nombre : '↓ ' + nombre) : frase, hs[0] ? HALLAZGO_COLOR(hs[0]) : '#f59e0b', '#111');
    return null;

/* ---------- Un cuarto completo ---------- */
function dibujarCuarto(q, t) {
  const [id] = q.k.split('|'), m = meta(id), s = status.get(q.k);
  const est = estadoEfectivo(s, id), dim = !['trabajando', 'esperando', 'error'].includes(est);
  ctx.save(); ctx.translate(q.x, q.y); ctx.beginPath(); ctx.rect(0, 0, RW, RH); ctx.clip();
  const cen = centroDe(q.k);
  cuartoBase(q, (nivel === 'todos' && cen !== COMUN && !m.global ? `${m.nombre} · ${cen}` : m.nombre).toUpperCase(), m.color, dim, t);
  let r;
  if (m.sala === 'logistica') r = salaLogistica(q, s, est, t, m.color);
  else if (m.sala === 'digitacion') r = salaDigitacion(q, s, est, t, m.color, m.areas || [{ id: 'gen', rotulo: m.nombre.toUpperCase(), color: m.color, tipos: /./ }]);
  else if (m.sala === 'recepcion') r = salaRecepcion(q, s, est, t, m.color);
  else if (m.sala === 'correo' && m.areas) r = salaCorreo(q, s, est, t, m.color, m.areas);
  else if (m.sala === 'jefatura') r = salaJefatura(q, s, est, t);
  else r = salaGenerica(q, s, est, t);

  if (r) {   // robot de pie (las salas sentadas lo dibujan ellas)
    if (est === 'trabajando') {
      const pose = r.accion === 'camina' ? 'camina' : r.accion === 'teclear' ? 'teclea' : 'pie';
      robot(r.x, r.y, m.color, { pose, carga: r.carga, t, est, mira: r.mira });
      if (s?.llamada) globo(r.x + 1, r.y - 18 - (r.accion === 'camina' ? Math.floor(t / 130) % 2 : 0), corto(s.llamada));
    } else if (est === 'esperando') { robot(r.x, r.y, m.color, { t, est }); zzz(r.x + 7, r.y - 14, t); }
    else if (est === 'error') {
      const sh = Math.floor(t / 60) % 2 ? 1 : -1;
      robot(r.x + sh, r.y, m.color, { t, est }); globo(r.x + 1, r.y - 18, s?.llamada ? '! ' + corto(s.llamada) : '!', '#ef4444', '#fff');
    } else if (est === 'durmiendo') { robot(r.x, r.y, m.color, { pose: 'dormido', t, est }); zzz(r.x + 7, r.y - 14, t, '196,181,253'); }
  }
  if ((est === 'caido' || est === 'sindatos') && !m.global) {
    const lx = (r?.x ?? RW / 2) - 7, ly = 84;
    px(lx, ly + 2, 14, 14, '#6b7280'); px(lx + 2, ly, 10, 2, '#6b7280'); px(lx - 2, ly + 16, 18, 3, '#4b5563');
    texto(est === 'caido' ? 'RIP' : '?', lx + 7, ly + 11, 4, '#d1d5db', true);
    if (est === 'caido') {
      const gy = ly - 18 + Math.sin(t / 400) * 3, gx = lx + 20;
      ctx.globalAlpha = .7; px(gx, gy, 8, 8, '#e5e7eb'); px(gx, gy + 8, 2, 2, '#e5e7eb'); px(gx + 3, gy + 8, 2, 2, '#e5e7eb'); px(gx + 6, gy + 8, 2, 2, '#e5e7eb');
      px(gx + 2, gy + 3, 1, 2, '#111'); px(gx + 5, gy + 3, 1, 2, '#111'); ctx.globalAlpha = 1;
    }
  }
  if (!m.global) avisoDelJefe(q, t); else campanaJefe(t);
  if (festejos.has(q.k) && !confeti(festejos.get(q.k), t)) festejos.delete(q.k);
  // capas de estado
  if (est === 'caido' || est === 'sindatos') { ctx.fillStyle = 'rgba(5,4,8,.55)'; ctx.fillRect(0, 0, RW, RH); }
  if (est === 'durmiendo') { ctx.fillStyle = 'rgba(20,10,60,.45)'; ctx.fillRect(0, 0, RW, RH); px(RW - 30, 30, 8, 8, '#e9d5ff'); px(RW - 27, 30, 6, 6, 'rgba(20,10,60,.9)'); }
  if (est === 'error') { ctx.fillStyle = `rgba(239,68,68,${.07 + .07 * Math.sin(t / 150)})`; ctx.fillRect(0, 0, RW, RH); }
  const v = ctx.createRadialGradient(RW / 2, RH / 2, 40, RW / 2, RH / 2, 120);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.4)'); ctx.fillStyle = v; ctx.fillRect(0, 0, RW, RH);
  if (est === 'error') { ctx.strokeStyle = `rgba(248,113,113,${.6 + .4 * Math.sin(t / 150)})`; ctx.lineWidth = 2; ctx.strokeRect(1, 1, RW - 2, RH - 2); }
  ctx.restore();
}

function loop(t) {
  quizasLayout();
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = false;
  if (fondo) ctx.drawImage(fondo, 0, 0, MW, MH);
  dibujarAntorchas(t);

}

/* Clic en un cuarto → detalle flotante (se cierra solo a los 8 s, al salir del cuarto o con otro clic) + resalta su tarjeta */

  const b = cv.getBoundingClientRect(), x = (e.clientX - b.left) / b.width * MW, y = (e.clientY - b.top) / b.height * MH;

  const limpio = ev => { let t = String(ev.mensaje || ''); if (ev.llamada) t = t.replace(new RegExp('^\\s*(OK\\s+)?' + ev.llamada.replace(/[-]/g, '\\-') + '\\s*', 'i'), ''); return t.replace(/\s+/g, ' ').trim().slice(0, 42); };

/* ---------- Tarjetas ---------- */

/* ---------- Sonido ---------- */
let actx = null, sonido = false, ultimoDing = 0;
try { sonido = localStorage.getItem('dungeon-sonido') === '1'; } catch {}
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function notas(lista, tipo = 'square', vol = .07, paso = .13) {
  const a = audio(); if (a.state !== 'running') return;
  lista.forEach((f, i) => {
    const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + i * paso;
    o.type = tipo; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + paso * .95);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + paso);
  });
}
function sonar(tipo) {
  if (!sonido) return;
  if (tipo === 'ok') { if (Date.now() - ultimoDing < 1500) return; ultimoDing = Date.now(); notas([1046, 1568], 'triangle', .06, .09); }
  else if (tipo === 'error') notas([880, 660, 880, 660], 'square', .08, .14);
  else if (tipo === 'caido') notas([440, 330, 247, 165], 'sawtooth', .06, .2);
  else if (tipo === 'prueba') notas([523, 659, 784, 1046], 'triangle', .07, .1);
}
const btnSnd = document.getElementById('snd');
function pintarBoton() {
  const listo = actx && actx.state === 'running';
  btnSnd.textContent = sonido ? (listo ? 'SONIDO: ON' : 'SONIDO: ON · TOCA PARA ACTIVAR') : 'SONIDO: OFF';
  btnSnd.classList.toggle('on', sonido && !!listo);
}
btnSnd.onclick = () => {
  sonido = !sonido; try { localStorage.setItem('dungeon-sonido', sonido ? '1' : '0'); } catch {}
  if (sonido) { audio(); setTimeout(() => { sonar('prueba'); pintarBoton(); }, 60); }
  pintarBoton();
};
// el navegador solo deja sonar después de un clic: el primero en la página lo activa
document.addEventListener('pointerdown', () => { if (sonido) { audio(); setTimeout(pintarBoton, 60); } });
pintarBoton();

/* ---------- Datos: Supabase ---------- */
async function initSupabase() {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const conAreas = ROBOTS.filter(r => r.areas).map(r => r.id);
  const cargar = async () => {
    const [st, rs, ev, hoy] = await Promise.all([
      sb.from('robot_status').select('*'),
      sb.from('robot_resumen_hoy').select('*'),
      sb.from('robot_eventos').select('*').order('created_at', { ascending: false }).limit(60),
      sb.from('robot_eventos').select('robot, pc, tipo, llamada, mensaje, created_at').gte('created_at', new Date(Date.now() - 2 * 86400000).toISOString()).order('created_at').limit(8000),
    ]);
    if (st.error) { document.getElementById('sub').textContent = 'Error leyendo Supabase: ' + st.error.message; return; }
    status.clear(); st.data.forEach(s => status.set(key(s.robot, s.pc), s));
    resumen.clear(); (rs.data || []).forEach(x => resumen.set(key(x.robot, x.pc), x));
    eventos = ev.data || [];
    areaStats.clear(); ultimoOk.clear(); flujo.clear();
    const ini = inicioDiaGT();
    (hoy.data || []).forEach(e => {
      if (e.created_at >= ini && (e.tipo === 'ok' || conAreas.includes(e.robot))) contarEvento(e);
      else if (e.tipo === 'ok' && e.llamada) contarEvento({ ...e, robot: e.robot, mensaje: e.mensaje, _soloFlujo: true });
    });
    await cargarHallazgos();
    ultimaFirma = ''; quizasLayout(); renderCards(); renderLog();
  };
  const cargarHallazgos = async () => {
    const { data, error } = await sb.from('jefe_hallazgos').select('*').is('cerrado_en', null).order('abierto_en');
    if (!error) hallazgos = data || [];
  };
  await cargar();
  let t; const recargarResumen = () => { clearTimeout(t); t = setTimeout(async () => {
    const { data } = await sb.from('robot_resumen_hoy').select('*');
    resumen.clear(); (data || []).forEach(x => resumen.set(key(x.robot, x.pc), x)); renderCards();
  }, 800); };
  sb.channel('monitor')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'robot_status' }, p => {
      const s = p.new && p.new.robot ? p.new : null; if (!s) return;
      status.set(key(s.robot, s.pc), s); quizasLayout(); renderCards();
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'robot_eventos' }, p => {
      eventos.unshift(p.new); eventos = eventos.slice(0, 100); contarEvento(p.new, true);
      if (p.new.robot === 'jefe' && p.new.tipo === 'ok' && /^Orden/i.test(p.new.mensaje || '')) {   // el Jefe dio una orden
        reaccionar('orden', 'A DIGITADORES');
        const kj = [...cuartos.keys()].find(esGlobal);
        if (kj) setTimeout(() => mandarMensajero(kj, 'digitadores', p.new.llamada || 'ORDEN', '#f59e0b', 'papel'), 1800);
      }
      if (p.new.tipo === 'ok') sonar('ok'); if (p.new.tipo === 'error') sonar('error');
      renderLog(); recargarResumen();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'jefe_hallazgos' }, async p => {
      if (p.eventType === 'INSERT') { campana = performance.now(); reaccionar('nuevo'); if (p.new?.severidad === 'alta') sonar('error'); }
      if (p.eventType === 'UPDATE' && p.new?.cerrado_en) {
        const k = [...cuartos.keys()].find(k => k.startsWith((p.new.robot || '') + '|') && (!p.new.pc || k.endsWith('|' + p.new.pc)));
        if (k) { festejos.set(k, performance.now()); sonar('prueba'); }
        reaccionar('resuelto');
      }
      await cargarHallazgos(); renderCards();
    })
    .subscribe();
  setInterval(cargar, 5 * 60 * 1000); // respaldo por si se cae el realtime
}

/* ---------- Datos: DEMO ---------- */
function initDemo() {
  document.getElementById('demoTag').hidden = false;
  document.getElementById('sub').textContent = 'HPC · Datos simulados (quita ?demo de la URL para ver los reales)';
  const now = Date.now(), iso = ms => new Date(ms).toISOString();
  const base = [
    { robot: 'citas',       pc: 'HPCLPJCOTUC',    estado: 'trabajando', llamada: 'LLS21-558012', detalle: 'Cita 412 · equipo 1 · SKU 4521', intervalo_seg: 300 },
    { robot: 'guias',       pc: 'HPCPCLOGISTICA', estado: 'trabajando', llamada: 'LLS21-557465', detalle: 'Procesando', intervalo_seg: 180 },
    { robot: 'digitadores', pc: 'HPCLPJCOTUC',    estado: 'trabajando', llamada: 'LLS21-556758', detalle: 'Procesando', intervalo_seg: 180 },
    { robot: 'correos',     pc: 'HPCLPJCOTUC',    estado: 'trabajando', llamada: '89DC279B', detalle: 'Enviando autoconsumo_solicitud', intervalo_seg: 120 },
  ];
  base.unshift({ robot: 'jefe', pc: 'HPCLPJCOTUC', estado: 'esperando', detalle: 'Todo en orden', intervalo_seg: 300 });
  base.forEach(b => status.set(key(b.robot, b.pc), { ...b, version: '1.0', last_seen: iso(now) }));
  base.forEach((b, i) => resumen.set(key(b.robot, b.pc), { ok_hoy: 3 + i * 2, errores_hoy: i === 2 ? 1 : 0 }));
  const TIPOS = ['autoconsumo_solicitud', 'autoconsumo_resuelto', 'garantia_taller', 'garantia_pendiente', 'garantia_resuelto'];
  for (let i = 0; i < 10; i++) {
    const ev = i % 2
      ? { robot: 'correos', pc: 'HPCLPJCOTUC', tipo: 'ok', llamada: 'AC' + (100 + i), mensaje: `${TIPOS[i % 5]} → usuario@hpc.com.gt`, created_at: iso(now - i * 300000) }
      : { robot: ['citas', 'guias', 'digitadores'][i % 3], pc: base[1 + i % 3].pc, tipo: 'ok', llamada: 'LLS21-5570' + (10 + i), mensaje: null, created_at: iso(now - i * 300000) };
    eventos.push(ev); contarEvento(ev);
  }
  ultimaFirma = ''; quizasLayout(); renderCards(); renderLog();
  let vuelta = 0;
  setInterval(() => {
    vuelta++;
    const antes = hallazgos.map(h => h.robot);
    hallazgos = vuelta % 3 === 1 ? [{ clave: 'citas:atoradas', robot: 'citas', severidad: 'alta', titulo: '2 cita(s) lista(s) sin llamada hace más de 30 min', detalle: 'El robot de Citas no las está tomando: 412-1, 413-1', abierto_en: iso(Date.now() - 600000) },
                                        { clave: 'correos:atrasados', robot: 'correos', severidad: 'media', titulo: '1 correo(s) en cola hace más de 15 min', detalle: 'autoconsumo_solicitud AC120', abierto_en: iso(Date.now() - 300000) }]
              : vuelta % 3 === 2 ? [{ clave: 'correos:atrasados', robot: 'correos', severidad: 'media', titulo: '1 correo(s) en cola hace más de 15 min', detalle: 'autoconsumo_solicitud AC120', abierto_en: iso(Date.now() - 300000) }] : [];
    antes.filter(r => !hallazgos.some(h => h.robot === r)).forEach(r => { const k = [...cuartos.keys()].find(k => k.startsWith(r + '|')); if (k) festejos.set(k, performance.now()); });
    if (hallazgos.some(h => !antes.includes(h.robot))) { campana = performance.now(); reaccionar('nuevo'); }
    else if (antes.some(r => !hallazgos.some(h => h.robot === r))) reaccionar('resuelto');
    else if (vuelta % 3 === 0) {   // de vez en cuando el Jefe da una orden de SKU
      reaccionar('orden', 'A DIGITADORES');
      setTimeout(() => mandarMensajero('jefe|HPCLPJCOTUC', 'digitadores', 'LLS21-55' + (8000 + (Math.random() * 999 | 0)), '#f59e0b', 'papel'), 1800);
    }
    Object.assign(status.get('jefe|HPCLPJCOTUC'), { estado: 'esperando', detalle: hallazgos.length ? `${hallazgos.length} hallazgo(s) abiertos` : 'Todo en orden', last_seen: iso(Date.now()) });
    base.filter(b => b.robot !== 'jefe').forEach(b => {
      const k = key(b.robot, b.pc), s = status.get(k), roll = Math.random();
      if (s.estado === 'trabajando' && roll < .5) {
        const ev = { robot: b.robot, pc: b.pc, tipo: 'ok', llamada: s.llamada, mensaje: b.robot === 'correos' ? s.detalle.replace('Enviando ', '') + ' → usuario@hpc.com.gt' : null, created_at: iso(Date.now()) };
        if (b.robot === 'digitadores') ev.mensaje = `${ev.llamada}  DIGITADA  Reparacion+Tecnico · Correctivo · logística`;
        eventos.unshift(ev); contarEvento(ev, true); resumen.get(k).ok_hoy++; sonar('ok');
        if (b.robot === 'digitadores') setTimeout(() => {           // Guías la imprime unos segundos después
          const g = { robot: 'guias', pc: 'HPCPCLOGISTICA', tipo: 'ok', llamada: ev.llamada, mensaje: `OK ${ev.llamada} guía → TSC`, created_at: iso(Date.now()) };
          eventos.unshift(g); contarEvento(g, true); resumen.get('guias|HPCPCLOGISTICA').ok_hoy++; renderLog();
        }, 14000);
      }
      if (roll < .15) Object.assign(s, { estado: 'esperando', llamada: null, detalle: 'Sin pendientes' });
      else if (roll < .18 && b.robot === 'guias') Object.assign(s, { estado: 'error', ultimo_error: 'No apareció el botón Imprimir en el visor' });
      else Object.assign(s, { estado: 'trabajando', llamada: b.robot === 'correos' ? 'AC' + (100 + (Math.random() * 900 | 0)) : 'LLS21-55' + (7000 + (Math.random() * 999 | 0)),
        detalle: b.robot === 'correos' ? 'Enviando ' + TIPOS[Math.random() * 5 | 0] : 'Procesando' });
      s.last_seen = iso(Date.now());
    });
    eventos = eventos.slice(0, 100); renderCards(); renderLog();
  }, 9000);
}

setInterval(renderCards, 15000); // refresca "hace X" y detecta caídos
DEMO ? initDemo() : initSupabase().catch(e => { document.getElementById('sub').textContent = 'Error: ' + e.message; });
requestAnimationFrame(loop);
</script>
