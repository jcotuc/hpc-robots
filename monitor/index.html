<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon de Robots HPC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0b12; --panel:#17131f; --line:#2c2438; --text:#e9e3f2; --muted:#9a8fae;
  --ok:#4ade80; --wait:#60a5fa; --err:#f87171; --dead:#6b6475; --gold:#f5c542;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px;border-bottom:2px solid var(--line);background:linear-gradient(#1b1525,#120e18)}
h1{font-family:"Press Start 2P",monospace;font-size:16px;margin:0;color:var(--gold);letter-spacing:1px}
.sub{font-size:12px;color:var(--muted);margin-top:6px}
.kpis{display:flex;gap:8px;flex-wrap:wrap}
.kpi{background:var(--panel);border:2px solid var(--line);padding:8px 12px;font-family:"Press Start 2P",monospace;font-size:10px;display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;display:inline-block;flex:none}
.tools{display:flex;gap:8px;align-items:center}
button{font-family:"Press Start 2P",monospace;font-size:9px;background:var(--panel);color:var(--text);border:2px solid var(--line);padding:8px 10px;cursor:pointer}
button:hover{border-color:var(--gold)}
button.on{border-color:var(--ok);color:var(--ok)}
.demo{font-family:"Press Start 2P",monospace;font-size:9px;color:#111;background:var(--gold);padding:6px 8px}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:12px}
.mapa{background:#07060a;border:2px solid var(--line);line-height:0;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
#mapa{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.lateral{display:flex;flex-direction:column;gap:12px;min-height:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;align-content:start}
.card{background:var(--panel);border:2px solid var(--line);padding:8px 10px;display:grid;gap:4px;scroll-margin:8px}
/* Escritorio: todo cabe en la pantalla, sin scroll de página */
@media (min-width:981px){
  html,body{height:100%}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{padding:10px 16px}
  main{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr)}
  .cards{grid-template-columns:1fr;overflow:auto;flex:0 0 auto;max-height:72%;padding-right:2px;gap:6px}
  .card{padding:6px 10px;gap:3px}
  .lateral aside h2{padding:8px 12px}
  .lateral aside{flex:1 1 0;min-height:120px;max-height:none;position:static}
}
.card.error{border-color:var(--err);animation:pulse 1s infinite}
.card.caido{border-color:#3a3442}
.card.foco{outline:2px solid var(--gold)}
@keyframes pulse{50%{box-shadow:0 0 18px rgba(248,113,113,.55)}}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.name{font-family:"Press Start 2P",monospace;font-size:11px}
.badge{font-family:"Press Start 2P",monospace;font-size:8px;padding:5px 6px;color:#111}
.meta{font-size:12px;color:var(--muted)}
.det{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err-txt{font-size:11px;color:var(--err);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;gap:12px;font-size:12px}
.stats b{font-family:"Press Start 2P",monospace;font-size:10px}
.areas{display:grid;gap:4px;border-top:1px solid var(--line);padding-top:6px}
.area{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px}
.area b{font-weight:600}
.area .meta{margin-left:auto}
.tag{font-family:"Press Start 2P",monospace;font-size:7px;padding:2px 4px;color:#111;margin-left:4px}
aside{background:var(--panel);border:2px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside h2{font-family:"Press Start 2P",monospace;font-size:10px;margin:0;padding:12px;border-bottom:2px solid var(--line);color:var(--gold)}
#log{overflow:auto;padding:8px 12px;display:grid;gap:6px;font-size:12px}
.ev{display:grid;grid-template-columns:52px 1fr;gap:6px;border-bottom:1px solid var(--line);padding-bottom:6px}
.ev time{color:var(--muted);font-variant-numeric:tabular-nums}
.ev .t-ok{color:var(--ok)} .ev .t-error{color:var(--err)} .ev .t-info{color:var(--wait)}
.empty{color:var(--muted);font-size:12px;padding:8px 0}
@media (max-width:980px){aside{max-height:420px}}
@media (max-width:480px){header{padding:12px 16px}h1{font-size:12px}main{padding:12px 16px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>DUNGEON DE ROBOTS</h1>
    <div class="sub" id="sub">HPC · Centros de Servicio</div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="tools">
    <span class="demo" id="demoTag" hidden>MODO DEMO</span>
    <button id="snd" title="Alarma en errores y caídos, campanita en cada OK">SONIDO: OFF</button>
  </div>
</header>
<main>
  <div class="mapa" id="mapaBox"><canvas id="mapa" aria-label="Mapa del dungeon con un cuarto por robot"></canvas></div>
  <div class="lateral">
    <div class="cards" id="cards"></div>
    <aside><h2>BITÁCORA EN VIVO</h2><div id="log"><div class="empty">Sin eventos todavía</div></div></aside>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ================== CONFIG ==================
   Deja vacío para MODO DEMO. Usa la ANON key (solo lectura por RLS). ?demo en la URL = datos simulados */
const SUPABASE_URL = 'https://kkzovradqpptmsaakqlb.supabase.co'; // proyecto de citas / MiMo
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtrem92cmFkcXBwdG1zYWFrcWxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NDEyMjMsImV4cCI6MjA5ODQxNzIyM30.-An3ySZYgSErKSTvfrui6BKrbEUcp-BgmloR7QsaRN4'; // Supabase → Project Settings → API → anon public

/* Robots esperados: si uno nunca reporta, aparece "SIN DATOS". id = el que usa crearMonitor("id")
   horario = el de su tarea programada (programar-tarea.cmd), hora Guatemala. Fuera de horario = DURMIENDO, no CAÍDO
   sala    = qué escena se dibuja: 'logistica' | 'digitacion' | 'recepcion' | 'correo' | (otra = escritorio genérico)
   areas   = puestos dentro del cuarto. Se reconocen por texto en lo que reporta el robot (tipos);
             el que tenga defecto:true recibe lo que no coincida con ninguno.                                   */
const LS = [1, 2, 3, 4, 5, 6]; // lunes a sábado
const ROBOTS = [
  { id: 'citas',       nombre: 'Citas',       sala: 'recepcion',  color: '#f5c542', horario: { dias: LS, desde: '05:55', hasta: '20:25' } },
  { id: 'guias',       nombre: 'Guías',       sala: 'logistica',  color: '#60a5fa', horario: { dias: LS, desde: '07:00', hasta: '20:00' } },
  { id: 'digitadores', nombre: 'Digitadores', sala: 'digitacion', color: '#2dd4bf', horario: { dias: LS, desde: '07:00', hasta: '18:00' },
    /* Un puesto por estado de llamada. Para agregar otro: { id, nombre, rotulo, color, tipos: /texto/i } */
    areas: [
      { id: 'garantia', nombre: 'Garantía', rotulo: 'GARANTIA', color: '#2dd4bf', tipos: /garant/i, defecto: true },
    ] },
  { id: 'correos',     nombre: 'Correos',     sala: 'correo',     color: '#f472b6', horario: { dias: LS, desde: '07:00', hasta: '20:00' },
    /* Departamentos: se reconocen por el tipo de correo (correos_cola.tipo) */
    areas: [
      { id: 'autoconsumos', nombre: 'Autoconsumos',   rotulo: 'AUTOCONSUMOS', color: '#fbbf24', tipos: /\bautoconsumo/ },
      { id: 'garantias',    nombre: 'Garantías / NC', rotulo: 'GARANTIA/NC',  color: '#38bdf8', tipos: /\b(garantia|nc)_/ },
    ] },
  // { id: 'mimo', nombre: 'MiMo', sala: 'recepcion', color: '#fb923c', horario: { dias: LS, desde: '05:55', hasta: '20:25' } },
];
const GRACIA_SEG = 90; // margen extra antes de declarar "caído" (intervalo*2 + gracia)
/* ============================================ */

const ESTADOS = {
  trabajando: { txt: 'TRABAJANDO', c: 'var(--ok)'   },
  esperando:  { txt: 'ESPERANDO',  c: 'var(--wait)' },
  durmiendo:  { txt: 'DURMIENDO',  c: '#a78bfa'     },
  error:      { txt: 'ERROR',      c: 'var(--err)'  },
  caido:      { txt: 'CAÍDO',      c: 'var(--dead)' },
  sindatos:   { txt: 'SIN DATOS',  c: 'var(--dead)' },
};
const DEMO = !SUPABASE_URL || !SUPABASE_ANON_KEY || new URLSearchParams(location.search).has('demo');
const status = new Map();    // robot|pc -> fila
const resumen = new Map();   // robot|pc -> {ok_hoy, errores_hoy}
const areaStats = new Map(); // robot|pc|area -> {ok, err, reint, ultimo}
const ultimoOk = new Map();  // robot|pc -> fecha del último OK (para animar "recién terminado")
let eventos = [];

const key = (r, pc) => `${r}|${pc}`;
const meta = id => ROBOTS.find(r => r.id === id) || { id, nombre: id, color: '#e9e3f2' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hhmm = ts => new Date(ts).toLocaleTimeString('es-GT', { hour: '2-digit', minute: '2-digit', hour12: false });
function hace(ts) {
  if (!ts) return '—';
  const s = Math.max(0, Math.round((Date.now() - new Date(ts).getTime()) / 1000));
  if (s < 60) return `hace ${s}s`;
  if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
  if (s < 86400) return `hace ${Math.floor(s / 3600)} h`;
  return `hace ${Math.floor(s / 86400)} d`;
}
const inicioDiaGT = () => { const f = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Guatemala' }); return new Date(f + 'T00:00:00-06:00').toISOString(); };

/* ---------- Estado efectivo ---------- */
function minEnHorario(id) {
  const h = meta(id).horario; if (!h) return 9999;
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'America/Guatemala', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  const dia = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(p.weekday);
  const min = (+p.hour % 24) * 60 + +p.minute, aMin = t => +t.slice(0, 2) * 60 + +t.slice(3);
  return h.dias.includes(dia) && min >= aMin(h.desde) && min <= aMin(h.hasta) ? min - aMin(h.desde) : null;
}
function estadoEfectivo(s, id) {
  const m = minEnHorario(id || s?.robot);
  if (!s) return m === null ? 'durmiendo' : 'sindatos';
  const limite = (s.intervalo_seg || 180) * 2 + GRACIA_SEG;
  const edad = (Date.now() - new Date(s.last_seen).getTime()) / 1000;
  if (edad <= limite) return s.estado;
  if (m === null || m * 60 < limite) return 'durmiendo';
  return 'caido';
}

/* ---------- Áreas (departamentos / estados) ---------- */
function areaDe(robotId, texto) {
  const a = meta(robotId).areas; if (!a) return null;
  return (texto && a.find(x => x.tipos.test(String(texto)))) || a.find(x => x.defecto) || null;
}
function contarEvento(ev) {
  if (ev.tipo === 'ok') { const k = key(ev.robot, ev.pc); if (!ultimoOk.get(k) || ev.created_at > ultimoOk.get(k)) ultimoOk.set(k, ev.created_at); }
  const ar = areaDe(ev.robot, ev.mensaje); if (!ar) return;
  const k = `${ev.robot}|${ev.pc}|${ar.id}`;
  const x = areaStats.get(k) || { ok: 0, err: 0, reint: 0, ultimo: null };
  if (ev.tipo === 'ok') { x.ok++; if (!x.ultimo || ev.created_at > x.ultimo) x.ultimo = ev.created_at; }
  else if (ev.tipo === 'error') x.err++;
  else x.reint++;
  areaStats.set(k, x);
}

/* =====================================================================
   MAPA: cuartos conectados por corredores (coordenadas lógicas en píxeles)
   ===================================================================== */
const RW = 184, RH = 120, G = 30, M = 18;
const cv = document.getElementById('mapa'), ctx = cv.getContext('2d');
let S = 3, MW = 0, MH = 0, cols = 1, fondo = null, antorchas = [];
const cuartos = new Map(); // robot|pc -> {k, x, y, fase}

function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
function texto(t, x, y, size, color, centro = false) {
  ctx.font = `${size}px "Press Start 2P", monospace`; ctx.fillStyle = color;
  ctx.fillText(t, Math.round(centro ? x - ctx.measureText(t).width / 2 : x), Math.round(y));
}
function rnd(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

function allKeys() {
  const ks = new Set([...status.keys()].filter(k => ROBOTS.some(r => r.id === k.split('|')[0])));
  ROBOTS.forEach(r => { if (![...ks].some(k => k.startsWith(r.id + '|'))) ks.add(key(r.id, '—')); });
  const orden = id => ROBOTS.findIndex(r => r.id === id);
  return [...ks].sort((a, b) => orden(a.split('|')[0]) - orden(b.split('|')[0]) || a.localeCompare(b));
}

function layout() {
  const keys = allKeys();
  const box = document.getElementById('mapaBox'), n = keys.length;
  const cw = (box.clientWidth || 800) - 4;
  const ch = pantallaCompleta.matches ? (box.clientHeight || 600) - 4 : Infinity;   // celular: solo el ancho manda
  // prueba 1..n columnas y se queda con la que deja los cuartos más grandes
  let mejor = null;
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c), w = 2 * M + c * RW + (c - 1) * G, h = 2 * M + r * RH + (r - 1) * G;
    const esc = Math.min(cw / w, ch / h);
    if (!mejor || esc > mejor.esc + 1e-6) mejor = { c, r, w, h, esc };
  }
  cols = mejor.c; const rows = mejor.r; MW = mejor.w; MH = mejor.h;
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = Math.floor(MW * mejor.esc) + 'px'; cv.style.height = Math.floor(MH * mejor.esc) + 'px';
  S = mejor.esc * dpr;
  cv.width = Math.round(MW * S); cv.height = Math.round(MH * S);
  const viejos = new Map(cuartos); cuartos.clear();
  keys.forEach((k, i) => cuartos.set(k, { k, x: M + (i % cols) * (RW + G), y: M + Math.floor(i / cols) * (RH + G), c: i % cols, r: Math.floor(i / cols), fase: viejos.get(k)?.fase ?? Math.random() * 8000 }));
  construirFondo(keys.length, rows);
  renderCards();
}
let ultimaFirma = '';
const pantallaCompleta = window.matchMedia('(min-width: 981px)');
function quizasLayout() { const b = document.getElementById('mapaBox'); const f = allKeys().join(',') + '|' + b.clientWidth + 'x' + b.clientHeight; if (f !== ultimaFirma) { ultimaFirma = f; layout(); } }
window.addEventListener('resize', () => { ultimaFirma = ''; quizasLayout(); });

/* Roca + corredores (estático, se dibuja una vez por layout) */
function construirFondo(n, rows) {
  fondo = document.createElement('canvas'); fondo.width = MW; fondo.height = MH;
  const f = fondo.getContext('2d'), r = rnd(7);
  const p = (x, y, w, h, c) => { f.fillStyle = c; f.fillRect(Math.round(x), Math.round(y), w, h); };
  p(0, 0, MW, MH, '#0b0910');
  for (let i = 0; i < MW * MH / 60; i++) p(r() * MW, r() * MH, 1 + (r() * 3 | 0), 1 + (r() * 2 | 0), r() < .5 ? '#14101b' : '#19141f');
  antorchas = [];
  const pasillo = (x, y, w, h, horizontal) => {
    p(x - 2, y - 2, w + 4, h + 4, '#2b2433');                   // muro del pasillo
    for (let yy = y; yy < y + h; yy += 6) for (let xx = x; xx < x + w; xx += 6)
      p(xx, yy, Math.min(6, x + w - xx), Math.min(6, y + h - yy), ((xx + yy) / 6) % 2 ? '#2a2333' : '#231d2b');
    for (let i = 0; i < (w * h) / 40; i++) p(x + r() * w, y + r() * h, 1, 1, '#1b1622');   // grietas
    if (r() < .5) p(x + 4 + r() * (w - 10), y + 3 + r() * (h - 6), 3, 2, '#d6d3d1');      // un hueso
    if (horizontal) antorchas.push([x + w / 2, y - 6]); else antorchas.push([x - 6, y + h / 2]);
  };
  cuartos.forEach(q => {
    const der = [...cuartos.values()].find(o => o.r === q.r && o.c === q.c + 1);
    if (der) pasillo(q.x + RW, q.y + 76, G, 16, true);
    const abajo = [...cuartos.values()].find(o => o.c === q.c && o.r === q.r + 1);
    if (abajo) pasillo(q.x + RW / 2 - 9, q.y + RH, 18, G, false);
  });
  // entrada del dungeon (escalera) arriba a la izquierda
  p(4, 4, 10, 10, '#2b2433'); for (let i = 0; i < 4; i++) p(5, 5 + i * 2.5, 8 - i * 2, 2, '#3a3046');
}

function dibujarAntorchas(t) {
  antorchas.forEach(([x, y], i) => {
    px(x - 1, y + 2, 2, 5, '#6b4a2b');
    const f = Math.sin(t / 90 + i * 1.7) > 0 ? 1 : 0;
    px(x - 2, y - 2 - f, 4, 4, '#f97316'); px(x - 1, y - 3 - f, 2, 3, '#fbbf24');
    const g = ctx.createRadialGradient(x, y, 1, x, y, 20);
    g.addColorStop(0, 'rgba(251,191,36,.16)'); g.addColorStop(1, 'rgba(251,191,36,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 20, y - 20, 40, 40);
  });
}

/* ---------- Robot ---------- */
/* pose: 'pie' | 'camina' | 'sentado' | 'teclea' | 'dormido' · carga: null | 'papel' | 'tarjeta' | 'sobre' */
function robot(x, y, col, { pose = 'pie', carga = null, t = 0, est = 'esperando', mira = 1 } = {}) {
  x = Math.round(x); y = Math.round(y);
  const sentado = pose === 'sentado' || pose === 'teclea' || pose === 'dormido';
  const paso = pose === 'camina' ? Math.floor(t / 130) % 2 : 0;
  const by = y - paso;
  if (!sentado) px(x - 6, y + 14, 13, 2, 'rgba(0,0,0,.35)');
  px(x - 4, by, 10, 9, col); px(x - 4, by, 10, 1, 'rgba(255,255,255,.35)'); px(x - 1, by + 3, 4, 3, 'rgba(0,0,0,.25)');
  px(x - 3, by - 8, 8, 7, '#e5e7eb'); px(x - 3, by - 2, 8, 1, '#9ca3af');
  const ojo = est === 'error' ? '#ef4444' : '#111827';
  const parpadeo = (t % 3000) < 120;
  if (pose === 'dormido' || parpadeo) { px(x - 2, by - 5, 2, 1, ojo); px(x + 2, by - 5, 2, 1, ojo); }
  else { const d = mira > 0 ? 1 : 0; px(x - 2 + d, by - 6, 2, 2, ojo); px(x + 2 + d, by - 6, 2, 2, ojo); }
  px(x, by - 11, 1, 3, '#9ca3af');
  const ant = est === 'error' ? '#ef4444' : est === 'trabajando' ? (Math.floor(t / 300) % 2 ? '#22c55e' : '#86efac') : pose === 'dormido' ? '#4b5563' : '#60a5fa';
  px(x - 1, by - 13, 3, 2, ant);
  if (!sentado) { px(x - 3, by + 9, 3, 4 - paso + 1, '#4b5563'); px(x + 2, by + 9, 3, 3 + paso + 1, '#4b5563'); }
  if (pose === 'teclea') {                                   // brazos al teclado, alternando
    const a = Math.floor(t / 90) % 2;
    px(x - 6, by + 4 + a, 2, 5, '#9ca3af'); px(x + 6, by + 5 - a, 2, 5, '#9ca3af');
  } else if (carga) {                                         // brazos al frente cargando algo
    px(x - 6, by + 3, 2, 4, '#9ca3af'); px(x + 6, by + 3, 2, 4, '#9ca3af');
    if (carga === 'papel') { px(x - 4, by + 5, 10, 6, '#f9fafb'); px(x - 3, by + 7, 7, 1, '#9ca3af'); px(x - 3, by + 9, 5, 1, '#9ca3af'); }
    if (carga === 'tarjeta') { px(x - 3, by + 5, 8, 5, '#fde68a'); px(x - 2, by + 6, 5, 1, '#b45309'); }
    if (carga === 'sobre') { px(x - 4, by + 5, 10, 6, '#f9fafb'); px(x - 4, by + 5, 10, 1, '#f472b6'); px(x, by + 7, 2, 1, '#f472b6'); }
  } else {
    const b = pose === 'camina' ? (paso ? 1 : -1) : 0;
    px(x - 6, by + 1 + b, 2, 6, '#9ca3af'); px(x + 6, by + 1 - b, 2, 6, '#9ca3af');
  }
}
const corto = v => { const t = String(v); return t.length > 13 ? '…' + t.slice(-12) : t; };
function globo(x, y, txt, bg = '#fff', fg = '#111') {
  ctx.font = '5px "Press Start 2P", monospace';
  const w = Math.ceil(ctx.measureText(txt).width) + 6;
  const bx = Math.max(5, Math.min(RW - 5 - w, Math.round(x - w / 2)));
  px(bx, y - 8, w, 9, bg); px(bx, y - 8, w, 1, 'rgba(255,255,255,.4)'); px(Math.round(x), y + 1, 2, 2, bg);
  ctx.fillStyle = fg; ctx.fillText(txt, bx + 3, y - 1);
}
function zzz(x, y, t, c = '147,197,253') {
  const z = (t / 1000) % 1; ctx.fillStyle = `rgba(${c},${1 - z})`; ctx.font = '5px "Press Start 2P", monospace';
  ctx.fillText('z', x, y - z * 8); ctx.fillText('Z', x + 4, y - 6 - z * 10);
}

/* Recorre una lista de pasos en bucle: {ir:[x,y], ms} camina · {hacer:'nombre', ms} se queda */
function ruta(t, inicio, pasos) {
  const total = pasos.reduce((a, p) => a + p.ms, 0);
  let tt = t % total, pos = inicio;
  for (const p of pasos) {
    if (tt < p.ms) {
      const f = tt / p.ms;
      if (p.ir) return { x: pos[0] + (p.ir[0] - pos[0]) * f, y: pos[1] + (p.ir[1] - pos[1]) * f, accion: 'camina', f, carga: p.carga, mira: Math.sign(p.ir[0] - pos[0]) || 1 };
      return { x: pos[0], y: pos[1], accion: p.hacer, f, carga: p.carga, mira: 1 };
    }
    tt -= p.ms; if (p.ir) pos = p.ir;
  }
  return { x: pos[0], y: pos[1], accion: 'pie', f: 0 };
}

/* ---------- Muebles ---------- */
function escritorio(x, y, w = 34) { px(x, y, w, 4, '#7c5a3a'); px(x, y, w, 1, '#9a7350'); px(x + 2, y + 4, 3, 12, '#5c4128'); px(x + w - 5, y + 4, 3, 12, '#5c4128'); }
function compu(x, y, est, t, activa) {
  px(x, y, 20, 14, '#1f2937'); px(x + 8, y + 14, 4, 2, '#111');
  const scr = est === 'error' && activa ? (Math.floor(t / 250) % 2 ? '#ef4444' : '#7f1d1d')
            : est === 'trabajando' && activa ? '#14532d' : est === 'esperando' ? '#1e3a8a' : '#0b0f17';
  px(x + 2, y + 2, 16, 10, scr);
  if (est === 'trabajando' && activa) for (let i = 0; i < 4; i++) px(x + 3, y + 3 + i * 2, 2 + ((t / 70 + i * 7) % 12), 1, '#86efac');
  if (est === 'esperando') { const b = Math.floor(t / 600) % 3; px(x + 4 + b * 4, y + 6, 3, 2, '#60a5fa'); }
}
function impresora(x, y, etiqueta, imprimiendo, f, error) {
  px(x - 1, y + 13, 24, 3, '#3f3f46'); px(x + 1, y + 16, 3, 8, '#27272a'); px(x + 18, y + 16, 3, 8, '#27272a');   // mesita
  px(x, y, 22, 13, '#d1d5db'); px(x, y, 22, 3, '#9ca3af'); px(x + 3, y + 8, 16, 2, '#4b5563');
  px(x + 18, y + 4, 2, 2, error ? '#ef4444' : imprimiendo ? '#22c55e' : '#374151');
  if (imprimiendo) px(x + 4, y + 9, 14, 2 + f * 9, '#ffffff');
  texto(etiqueta, x + 11, y + 30, 4, '#cbd5e1', true);
}
function maquina(x, y) { // taladro HPC
  px(x, y + 2, 10, 4, '#b91c1c'); px(x + 10, y + 3, 4, 2, '#9ca3af'); px(x + 2, y + 6, 4, 6, '#111827'); px(x + 1, y + 11, 6, 2, '#b91c1c'); px(x, y + 2, 10, 1, '#ef4444');
}
function letrero(x, y, w, txt, color, dim) {
  px(x, y, w, 9, dim ? '#3b3340' : color); px(x, y, w, 1, 'rgba(255,255,255,.35)');
  texto(txt, x + w / 2, y + 7, 4, '#111', true);
}

/* ---------- Cuarto base ---------- */
function cuartoBase(q, nombre, col, dim, t) {
  // piso
  for (let y = 26; y < RH - 4; y += 8) for (let x = 4; x < RW - 4; x += 8)
    px(x, y, Math.min(8, RW - 4 - x), Math.min(8, RH - 4 - y), ((x + y) / 8) % 2 ? '#2a2333' : '#241e2c');
  // muro del fondo
  px(0, 0, RW, 26, '#3a3046');
  for (let y = 0; y < 26; y += 6) for (let x = (y / 6) % 2 ? -6 : 0; x < RW; x += 12) { px(x, y, 11, 5, '#4a3d58'); px(x, y, 11, 1, '#56486a'); }
  px(0, 24, RW, 2, '#1a1520');
  // muros laterales e inferior, con puertas hacia los corredores
  px(0, 26, 4, RH - 26, '#1a1520'); px(RW - 4, 26, 4, RH - 26, '#1a1520'); px(0, RH - 4, RW, 4, '#1a1520');
  const hayIzq = [...cuartos.values()].some(o => o.r === q.r && o.c === q.c - 1);
  const hayDer = [...cuartos.values()].some(o => o.r === q.r && o.c === q.c + 1);
  const hayAbajo = [...cuartos.values()].some(o => o.c === q.c && o.r === q.r + 1);
  const hayArriba = q.r > 0;
  if (hayIzq) px(0, 76, 4, 16, '#2a2333');
  if (hayDer) px(RW - 4, 76, 4, 16, '#2a2333');
  if (hayAbajo) px(RW / 2 - 9, RH - 4, 18, 4, '#2a2333');
  if (hayArriba) { px(RW / 2 - 9, 6, 18, 20, '#120e18'); px(RW / 2 - 9, 6, 18, 2, '#56486a'); }   // arco
  // antorchas del cuarto
  [12, RW - 12].forEach((tx, i) => {
    px(tx - 1, 12, 3, 8, '#6b4a2b');
    if (!dim) {
      const f = Math.sin(t / 90 + i * 2 + q.fase) > 0 ? 1 : 0;
      px(tx - 2, 7 - f, 5, 5, '#f97316'); px(tx - 1, 5 - f, 3, 4, '#fbbf24'); px(tx, 4 - f, 1, 2, '#fff7d6');
      const g = ctx.createRadialGradient(tx, 10, 1, tx, 10, 26);
      g.addColorStop(0, 'rgba(251,191,36,.16)'); g.addColorStop(1, 'rgba(251,191,36,0)');
      ctx.fillStyle = g; ctx.fillRect(tx - 26, 0, 52, 40);
    } else px(tx - 1, 9, 3, 3, '#3b3340');
  });
  // placa con el nombre
  ctx.font = '5px "Press Start 2P", monospace';
  const w = Math.ceil(ctx.measureText(nombre).width) + 10, x0 = Math.round(RW / 2 - w / 2);
  if (!hayArriba) { px(x0, 6, w, 11, '#5c4128'); px(x0 + 1, 7, w - 2, 9, '#7c5a3a'); px(x0, 6, w, 1, col); texto(nombre, RW / 2, 14, 5, '#fef3c7', true); }
  else { px(x0, 0, w, 6, '#5c4128'); texto(nombre, RW / 2, 5, 4, '#fef3c7', true); }
}

/* ---------- Escenas ---------- */
function salaLogistica(q, s, est, t, col) {
  const PC = [30, 78], PA = [74, 78], PB = [106, 78], ME = [148, 78];
  escritorio(14, 60, 34); compu(20, 44, est, t, true);
  // mesa de embalaje con caja
  px(126, 66, 48, 4, '#7c5a3a'); px(126, 66, 48, 1, '#9a7350'); px(128, 70, 3, 14, '#5c4128'); px(169, 70, 3, 14, '#5c4128');
  // cajas listas (una por llamada OK hoy, máx. 6)
  const ok = Math.min(6, resumen.get(q.k)?.ok_hoy || 0);
  for (let i = 0; i < ok; i++) { const bx = 140 + (i % 3) * 11, by = 104 - Math.floor(i / 3) * 8; px(bx, by, 10, 8, '#b45309'); px(bx, by, 10, 1, '#d97706'); px(bx + 4, by, 2, 8, '#fde68a'); }
  let r = { x: PC[0], y: PC[1], accion: 'pie', f: 0 };
  if (est === 'trabajando') r = ruta(t + q.fase, PC, [
    { hacer: 'teclear', ms: 1600 }, { ir: PA, ms: 900 }, { hacer: 'imprimirA', ms: 1000 },
    { ir: PB, ms: 700, carga: 'papel' }, { hacer: 'imprimirB', ms: 1000, carga: 'papel' },
    { ir: ME, ms: 900, carga: 'papel' }, { hacer: 'embalar', ms: 2600 }, { ir: PC, ms: 1500 },
  ]);
  const errImp = est === 'error' && /imprim|visor|impresora/i.test(s?.ultimo_error || '');
  impresora(64, 50, 'GUIA', r.accion === 'imprimirA', r.f, errImp);
  impresora(96, 50, 'DIAG', r.accion === 'imprimirB', r.f, errImp);
  // caja abierta y máquina; al embalar: la máquina entra, se cierran las solapas y se pone cinta
  const e = r.accion === 'embalar' ? r.f : 0;
  if (e < .35) maquina(130 + e / .35 * 14, 52 + Math.sin(e / .35 * Math.PI) * -6);
  px(144, 56, 18, 10, '#b45309'); px(144, 56, 18, 1, '#d97706');
  if (e >= .35) maquina(145, 53);
  if (e > .55) { const c = Math.min(1, (e - .55) / .25); px(144, 56 - 3 * (1 - c), 9, 3, '#d97706'); px(153, 56 - 3 * (1 - c), 9, 3, '#d97706'); }
  if (e > .8) px(152, 55, 2, 10, '#fde68a');
  else if (e === 0) { px(141, 53, 3, 4, '#d97706'); px(162, 53, 3, 4, '#d97706'); }
  return r;
}

function salaDigitacion(q, s, est, t, col, areas) {
  const n = areas.length, ancho = (RW - 16) / n;
  const activa = est === 'trabajando' || est === 'error' ? areaDe(q.k.split('|')[0], s?.detalle + ' ' + (s?.ultimo_error || '')) : null;
  const recien = ultimoOk.get(q.k) && Date.now() - new Date(ultimoOk.get(q.k)).getTime() < 15000;
  areas.forEach((a, i) => {
    const cx = Math.round(8 + ancho * i + ancho / 2), dim = !['trabajando', 'esperando', 'error'].includes(est);
    const st = areaStats.get(`${q.k}|${a.id}`) || {};
    const esta = activa === a;
    letrero(cx - 26, 30, 52, a.rotulo, a.color, dim);
    // silla (detrás del robot)
    px(cx - 9, 56, 3, 22, '#3f3f46'); px(cx - 9, 76, 14, 3, '#3f3f46');
    // robot sentado detrás del escritorio
    const pose = est === 'trabajando' && esta ? 'teclea' : ['durmiendo', 'esperando'].includes(est) ? 'dormido' : 'sentado';
    if (!['caido', 'sindatos'].includes(est)) robot(cx - 2, 64 + (pose === 'teclea' ? (Math.floor(t / 180) % 2) : 0), col, { pose, t: t + i * 400, est: esta ? est : 'esperando' });
    // escritorio al frente, monitor de lado y teclado
    px(cx - 22, 76, 50, 5, '#7c5a3a'); px(cx - 22, 76, 50, 1, '#9a7350'); px(cx - 22, 81, 50, 18, '#5c4128'); px(cx - 20, 83, 46, 1, '#4a3420');
    compu(cx + 8, 60, est, t, esta);
    px(cx - 12, 74, 18, 3, '#d1d5db');
    if (pose === 'teclea') for (let k = 0; k < 3; k++) px(cx - 11 + ((t / 60 + k * 5) % 16), 74, 2, 1, '#22c55e');
    // pila de llamadas digitadas hoy + contador
    const pila = Math.min(8, st.ok || 0);
    for (let k = 0; k < pila; k++) px(cx - 20, 74 - k * 1.5, 7, 2, k % 2 ? '#f9fafb' : '#e5e7eb');
    texto(String(st.ok || 0), cx + 3, 92, 5, dim ? '#6b6475' : '#fef3c7', true);
    if (pose === 'teclea') globo(cx - 2, 46, s?.llamada ? corto(s.llamada) : '...');
    if (recien && esta && est !== 'error') { px(cx + 22, 44, 7, 7, '#22c55e'); px(cx + 24, 48, 1, 1, '#fff'); px(cx + 25, 49, 1, 1, '#fff'); px(cx + 26, 47, 1, 2, '#fff'); px(cx + 27, 45, 1, 2, '#fff'); }
    if (est === 'error' && esta) globo(cx - 2, 46, s?.llamada ? '! ' + corto(s.llamada) : '!', '#ef4444', '#fff');
    if (pose === 'dormido' && !dim) zzz(cx + 4, 52, t);
  });
  return null; // el robot ya se dibujó
}

function salaRecepcion(q, s, est, t, col) {
  const BA = [26, 78], PC = [92, 78], SE = [148, 78];
  // calendario en el muro
  px(20, 28, 34, 22, '#f5f5f4'); px(20, 28, 34, 5, '#b91c1c');
  for (let f = 0; f < 3; f++) for (let c = 0; c < 6; c++) px(22 + c * 5, 35 + f * 5, 4, 4, (f * 6 + c) % 5 === 2 ? '#fbbf24' : '#d6d3d1');
  texto('CITAS', 37, 32, 4, '#fff', true);
  // bandeja de citas entrantes
  px(14, 62, 26, 4, '#7c5a3a'); px(16, 66, 3, 12, '#5c4128'); px(35, 66, 3, 12, '#5c4128');
  for (let i = 0; i < 3; i++) px(18 + i, 58 - i * 2, 12, 4, '#fde68a');
  // mostrador con compu
  escritorio(74, 62, 40); compu(84, 46, est, t, true);
  // sello + llamadas creadas
  px(132, 62, 32, 4, '#7c5a3a'); px(134, 66, 3, 12, '#5c4128'); px(159, 66, 3, 12, '#5c4128');
  const ok = Math.min(8, resumen.get(q.k)?.ok_hoy || 0);
  for (let i = 0; i < ok; i++) px(150, 60 - i * 1.5, 10, 2, i % 2 ? '#f9fafb' : '#e5e7eb');
  // banca de espera con un cliente
  px(130, 98, 40, 3, '#5c4128'); px(132, 101, 2, 8, '#3f2a1a'); px(166, 101, 2, 8, '#3f2a1a');
  if (!['durmiendo', 'caido', 'sindatos'].includes(est)) { px(150, 86, 7, 7, '#a8a29e'); px(149, 93, 9, 6, '#57534e'); }
  let r = { x: PC[0], y: PC[1], accion: 'pie', f: 0 };
  if (est === 'trabajando') r = ruta(t + q.fase, PC, [
    { ir: BA, ms: 1200 }, { hacer: 'tomar', ms: 700 }, { ir: PC, ms: 1200, carga: 'tarjeta' },
    { hacer: 'teclear', ms: 2200 }, { ir: SE, ms: 1100, carga: 'papel' }, { hacer: 'sellar', ms: 1100, carga: 'papel' }, { ir: PC, ms: 1100 },
  ]);
  const sello = r.accion === 'sellar' ? Math.abs(Math.sin(r.f * Math.PI * 3)) : 0;
  px(139, 52 - sello * 6, 6, 6, '#7f1d1d'); px(140, 49 - sello * 6, 4, 3, '#57534e');
  if (r.accion === 'sellar' && r.f > .5) { px(136, 60, 12, 2, '#fff'); px(139, 60, 6, 1, '#b91c1c'); }
  return r;
}

function salaCorreo(q, s, est, t, col, areas) {
  const n = areas.length, xV = a => Math.round(RW * (areas.indexOf(a) + 1) / (n + 1));
  const activa = est === 'trabajando' ? areaDe('correos', s?.detalle) : null;
  const conError = est === 'error' ? areaDe('correos', s?.ultimo_error) : null;
  const dim = !['trabajando', 'esperando', 'error'].includes(est);
  areas.forEach(a => {
    const cx = xV(a), x0 = cx - 22, st = areaStats.get(`${q.k}|${a.id}`) || {};
    const reciente = st.ultimo && Date.now() - new Date(st.ultimo).getTime() < 3 * 60000;
    letrero(cx - 26, 30, 52, a.rotulo, a.color, dim);
    px(x0, 58, 44, 5, '#7c5a3a'); px(x0, 58, 44, 1, '#9a7350'); px(x0 + 2, 63, 40, 9, '#5c4128');
    const pila = Math.min(6, st.ok || 0);
    for (let i = 0; i < pila; i++) px(x0 + 4 + (i % 3) * 5, 53 - Math.floor(i / 3) * 3, 4, 3, i % 2 ? '#f9fafb' : '#e5e7eb');
    const bx = x0 + 28;
    px(bx, 46, 12, 12, conError === a ? '#b91c1c' : '#475569'); px(bx, 46, 12, 2, 'rgba(255,255,255,.25)'); px(bx + 2, 50, 8, 2, '#111827');
    const arriba = activa === a || reciente;
    px(bx + 12, arriba ? 44 : 52, 1, arriba ? 8 : 4, '#9ca3af'); px(bx + 13, arriba ? 44 : 52, 4, 3, arriba && !dim ? a.color : '#4b5563');
    if (activa === a && !dim) { ctx.fillStyle = `rgba(255,255,255,${.1 + .08 * Math.sin(t / 120)})`; ctx.fillRect(x0, 28, 44, 46); }
    if (conError === a) globo(cx, 28, '!', '#ef4444', '#fff');
    texto(String(st.ok || 0), cx, 70, 5, dim ? '#6b6475' : '#e5e7eb', true);
  });
  // mesa de clasificación al centro
  px(RW / 2 - 14, 98, 28, 4, '#7c5a3a'); px(RW / 2 - 12, 102, 3, 8, '#5c4128'); px(RW / 2 + 9, 102, 3, 8, '#5c4128');
  for (let i = 0; i < 4; i++) px(RW / 2 - 10 + i * 5, 95, 4, 3, '#f9fafb');
  let r = { x: RW / 2, y: 82, accion: 'pie', f: 0 };
  if (est === 'trabajando' && activa) {
    const V = [xV(activa) - 4, 80];
    r = ruta(t + q.fase, [RW / 2, 82], [{ hacer: 'tomar', ms: 600 }, { ir: V, ms: 1000, carga: 'sobre' }, { hacer: 'echar', ms: 700 }, { ir: [RW / 2, 82], ms: 1000 }]);
    if (r.accion === 'echar') { const bx = xV(activa) + 12, p = r.f; px(r.x + (bx - r.x) * p - 3, 70 - Math.sin(p * Math.PI) * 14 - p * 18, 7, 5, '#f9fafb'); }
  } else if (est === 'error' && conError) r = { x: xV(conError) - 4, y: 80, accion: 'pie', f: 0 };
  return r;
}

function salaGenerica(q, s, est, t) {
  escritorio(70, 60, 40); compu(80, 44, est, t, true);
  return { x: 90, y: 78, accion: est === 'trabajando' ? 'teclear' : 'pie', f: 0 };
}

/* ---------- Un cuarto completo ---------- */
function dibujarCuarto(q, t) {
  const [id] = q.k.split('|'), m = meta(id), s = status.get(q.k);
  const est = estadoEfectivo(s, id), dim = !['trabajando', 'esperando', 'error'].includes(est);
  ctx.save(); ctx.translate(q.x, q.y); ctx.beginPath(); ctx.rect(0, 0, RW, RH); ctx.clip();
  cuartoBase(q, m.nombre.toUpperCase(), m.color, dim, t);
  let r;
  if (m.sala === 'logistica') r = salaLogistica(q, s, est, t, m.color);
  else if (m.sala === 'digitacion') r = salaDigitacion(q, s, est, t, m.color, m.areas || [{ id: 'gen', rotulo: m.nombre.toUpperCase(), color: m.color, tipos: /./ }]);
  else if (m.sala === 'recepcion') r = salaRecepcion(q, s, est, t, m.color);
  else if (m.sala === 'correo' && m.areas) r = salaCorreo(q, s, est, t, m.color, m.areas);
  else r = salaGenerica(q, s, est, t);

  if (r) {   // robot de pie (las salas sentadas lo dibujan ellas)
    if (est === 'trabajando') {
      const pose = r.accion === 'camina' ? 'camina' : r.accion === 'teclear' ? 'teclea' : 'pie';
      robot(r.x, r.y, m.color, { pose, carga: r.carga, t, est, mira: r.mira });
      if (s?.llamada) globo(r.x + 1, r.y - 18 - (r.accion === 'camina' ? Math.floor(t / 130) % 2 : 0), corto(s.llamada));
    } else if (est === 'esperando') { robot(r.x, r.y, m.color, { t, est }); zzz(r.x + 7, r.y - 14, t); }
    else if (est === 'error') {
      const sh = Math.floor(t / 60) % 2 ? 1 : -1;
      robot(r.x + sh, r.y, m.color, { t, est }); globo(r.x + 1, r.y - 18, s?.llamada ? '! ' + corto(s.llamada) : '!', '#ef4444', '#fff');
    } else if (est === 'durmiendo') { robot(r.x, r.y, m.color, { pose: 'dormido', t, est }); zzz(r.x + 7, r.y - 14, t, '196,181,253'); }
  }
  if (est === 'caido' || est === 'sindatos') {
    const lx = (r?.x ?? RW / 2) - 7, ly = 84;
    px(lx, ly + 2, 14, 14, '#6b7280'); px(lx + 2, ly, 10, 2, '#6b7280'); px(lx - 2, ly + 16, 18, 3, '#4b5563');
    texto(est === 'caido' ? 'RIP' : '?', lx + 7, ly + 11, 4, '#d1d5db', true);
    if (est === 'caido') {
      const gy = ly - 18 + Math.sin(t / 400) * 3, gx = lx + 20;
      ctx.globalAlpha = .7; px(gx, gy, 8, 8, '#e5e7eb'); px(gx, gy + 8, 2, 2, '#e5e7eb'); px(gx + 3, gy + 8, 2, 2, '#e5e7eb'); px(gx + 6, gy + 8, 2, 2, '#e5e7eb');
      px(gx + 2, gy + 3, 1, 2, '#111'); px(gx + 5, gy + 3, 1, 2, '#111'); ctx.globalAlpha = 1;
    }
  }
  // capas de estado
  if (est === 'caido' || est === 'sindatos') { ctx.fillStyle = 'rgba(5,4,8,.55)'; ctx.fillRect(0, 0, RW, RH); }
  if (est === 'durmiendo') { ctx.fillStyle = 'rgba(20,10,60,.45)'; ctx.fillRect(0, 0, RW, RH); px(RW - 30, 30, 8, 8, '#e9d5ff'); px(RW - 27, 30, 6, 6, 'rgba(20,10,60,.9)'); }
  if (est === 'error') { ctx.fillStyle = `rgba(239,68,68,${.07 + .07 * Math.sin(t / 150)})`; ctx.fillRect(0, 0, RW, RH); }
  const v = ctx.createRadialGradient(RW / 2, RH / 2, 40, RW / 2, RH / 2, 120);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.4)'); ctx.fillStyle = v; ctx.fillRect(0, 0, RW, RH);
  if (est === 'error') { ctx.strokeStyle = `rgba(248,113,113,${.6 + .4 * Math.sin(t / 150)})`; ctx.lineWidth = 2; ctx.strokeRect(1, 1, RW - 2, RH - 2); }
  ctx.restore();
}

function loop(t) {
  quizasLayout();
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.imageSmoothingEnabled = false;
  if (fondo) ctx.drawImage(fondo, 0, 0, MW, MH);
  dibujarAntorchas(t);
  cuartos.forEach(q => dibujarCuarto(q, t));
  requestAnimationFrame(loop);
}

/* Clic en un cuarto → su tarjeta */
cv.addEventListener('click', e => {
  const b = cv.getBoundingClientRect(), x = (e.clientX - b.left) / b.width * MW, y = (e.clientY - b.top) / b.height * MH;
  const q = [...cuartos.values()].find(q => x >= q.x && x <= q.x + RW && y >= q.y && y <= q.y + RH);
  const el = q && document.querySelector(`.card[data-k="${CSS.escape(q.k)}"]`);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); el.classList.add('foco'); setTimeout(() => el.classList.remove('foco'), 1500); }
});

/* ---------- Tarjetas ---------- */
const prevEst = new Map();
function renderCards() {
  const cont = document.getElementById('cards');
  const cnt = { trabajando: 0, esperando: 0, error: 0, caido: 0, sindatos: 0, durmiendo: 0 };
  cont.innerHTML = [...cuartos.keys()].map(k => {
    const [id, pc] = k.split('|'), s = status.get(k), e = estadoEfectivo(s, id); cnt[e]++;
    const m = meta(id), rs = resumen.get(k) || { ok_hoy: 0, errores_hoy: 0 };
    const p = prevEst.get(k); if (p && p !== e && (e === 'error' || e === 'caido')) sonar(e); prevEst.set(k, e);
    const det = e === 'caido' ? `Sin reportar desde ${s ? hhmm(s.last_seen) : '—'} (esperado cada ${Math.round((s?.intervalo_seg || 180) / 60)} min)`
      : e === 'sindatos' ? 'Aún no reporta al monitor'
      : e === 'durmiendo' ? `Fuera de horario (${m.horario.desde}–${m.horario.hasta})${s ? ' · última: ' + (s.detalle || '') : ''}`
      : (s?.detalle || '') + (s?.llamada ? (m.sala === 'correo' ? ' · Ref. ' : ' · Llamada ') + s.llamada : '');
    return `<article class="card ${e}" data-k="${esc(k)}">
      <div class="row"><span class="name" style="color:${m.color}">${esc(m.nombre)}</span><span class="badge" style="background:${ESTADOS[e].c}">${ESTADOS[e].txt}</span></div>
      <div class="row meta"><span>PC: ${esc(pc)}${s?.version ? ' · v' + esc(s.version) : ''}</span><span>${hace(s?.last_seen)}</span></div>
      <div class="det" title="${esc(det)}">${esc(det)}</div>
      ${s?.ultimo_error ? `<div class="err-txt" title="${esc(s.ultimo_error)}">Último error: ${esc(s.ultimo_error)}</div>` : ''}
      <div class="stats"><span>Hoy OK <b style="color:var(--ok)">${rs.ok_hoy}</b></span><span>Errores <b style="color:var(--err)">${rs.errores_hoy}</b></span></div>
      ${m.areas ? `<div class="areas">${m.areas.map(a => { const x = areaStats.get(`${k}|${a.id}`) || {}; return `
        <div class="area"><span class="dot" style="background:${a.color}"></span><b>${esc(a.nombre)}</b>
          <span>OK <b style="color:var(--ok)">${x.ok || 0}</b></span>${x.err ? `<span>Err <b style="color:var(--err)">${x.err}</b></span>` : ''}${x.reint ? `<span>Reint. <b style="color:var(--gold)">${x.reint}</b></span>` : ''}
          <span class="meta">${x.ultimo ? 'último ' + hhmm(x.ultimo) : 'sin movimiento hoy'}</span></div>`; }).join('')}</div>` : ''}
    </article>`;
  }).join('');
  document.getElementById('kpis').innerHTML = [
    ['trabajando', cnt.trabajando], ['esperando', cnt.esperando], ['durmiendo', cnt.durmiendo], ['error', cnt.error], ['caido', cnt.caido], ['sindatos', cnt.sindatos],
  ].filter(([e, n]) => n || ['trabajando', 'error', 'caido'].includes(e))
   .map(([e, n]) => `<div class="kpi"><span class="dot" style="background:${ESTADOS[e].c}"></span>${ESTADOS[e].txt} ${n}</div>`).join('');
  document.title = (cnt.error + cnt.caido ? `(${cnt.error + cnt.caido}) ` : '') + 'Dungeon de Robots HPC';
}

function renderLog() {
  const log = document.getElementById('log');
  if (!eventos.length) { log.innerHTML = '<div class="empty">Sin eventos todavía</div>'; return; }
  log.innerHTML = eventos.slice(0, 60).map(ev => {
    const a = meta(ev.robot).areas && areaDe(ev.robot, ev.mensaje);
    return `<div class="ev"><time>${hhmm(ev.created_at)}</time>
      <div><span class="t-${ev.tipo}">${ev.tipo.toUpperCase()}</span> <b>${esc(meta(ev.robot).nombre)}</b>${a && meta(ev.robot).areas.length > 1 ? `<span class="tag" style="background:${a.color}">${esc(a.nombre)}</span>` : ''}
      ${ev.llamada ? '· ' + esc(ev.llamada) : ''}${ev.mensaje ? `<div class="meta">${esc(ev.mensaje)}</div>` : ''}</div></div>`;
  }).join('');
}

/* ---------- Sonido ---------- */
let actx = null, sonido = false, ultimoDing = 0;
try { sonido = localStorage.getItem('dungeon-sonido') === '1'; } catch {}
function audio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function notas(lista, tipo = 'square', vol = .07, paso = .13) {
  const a = audio(); if (a.state !== 'running') return;
  lista.forEach((f, i) => {
    const o = a.createOscillator(), g = a.createGain(), t0 = a.currentTime + i * paso;
    o.type = tipo; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + paso * .95);
    o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + paso);
  });
}
function sonar(tipo) {
  if (!sonido) return;
  if (tipo === 'ok') { if (Date.now() - ultimoDing < 1500) return; ultimoDing = Date.now(); notas([1046, 1568], 'triangle', .06, .09); }
  else if (tipo === 'error') notas([880, 660, 880, 660], 'square', .08, .14);
  else if (tipo === 'caido') notas([440, 330, 247, 165], 'sawtooth', .06, .2);
  else if (tipo === 'prueba') notas([523, 659, 784, 1046], 'triangle', .07, .1);
}
const btnSnd = document.getElementById('snd');
function pintarBoton() {
  const listo = actx && actx.state === 'running';
  btnSnd.textContent = sonido ? (listo ? 'SONIDO: ON' : 'SONIDO: ON · TOCA PARA ACTIVAR') : 'SONIDO: OFF';
  btnSnd.classList.toggle('on', sonido && !!listo);
}
btnSnd.onclick = () => {
  sonido = !sonido; try { localStorage.setItem('dungeon-sonido', sonido ? '1' : '0'); } catch {}
  if (sonido) { audio(); setTimeout(() => { sonar('prueba'); pintarBoton(); }, 60); }
  pintarBoton();
};
// el navegador solo deja sonar después de un clic: el primero en la página lo activa
document.addEventListener('pointerdown', () => { if (sonido) { audio(); setTimeout(pintarBoton, 60); } });
pintarBoton();

/* ---------- Datos: Supabase ---------- */
async function initSupabase() {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const conAreas = ROBOTS.filter(r => r.areas).map(r => r.id);
  const cargar = async () => {
    const [st, rs, ev, hoy] = await Promise.all([
      sb.from('robot_status').select('*'),
      sb.from('robot_resumen_hoy').select('*'),
      sb.from('robot_eventos').select('*').order('created_at', { ascending: false }).limit(60),
      sb.from('robot_eventos').select('robot, pc, tipo, mensaje, created_at').gte('created_at', inicioDiaGT()).limit(5000),
    ]);
    if (st.error) { document.getElementById('sub').textContent = 'Error leyendo Supabase: ' + st.error.message; return; }
    status.clear(); st.data.forEach(s => status.set(key(s.robot, s.pc), s));
    resumen.clear(); (rs.data || []).forEach(x => resumen.set(key(x.robot, x.pc), x));
    eventos = ev.data || [];
    areaStats.clear(); ultimoOk.clear(); (hoy.data || []).filter(e => e.tipo === 'ok' || conAreas.includes(e.robot)).forEach(contarEvento);
    ultimaFirma = ''; quizasLayout(); renderCards(); renderLog();
  };
  await cargar();
  let t; const recargarResumen = () => { clearTimeout(t); t = setTimeout(async () => {
    const { data } = await sb.from('robot_resumen_hoy').select('*');
    resumen.clear(); (data || []).forEach(x => resumen.set(key(x.robot, x.pc), x)); renderCards();
  }, 800); };
  sb.channel('monitor')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'robot_status' }, p => {
      const s = p.new && p.new.robot ? p.new : null; if (!s) return;
      status.set(key(s.robot, s.pc), s); quizasLayout(); renderCards();
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'robot_eventos' }, p => {
      eventos.unshift(p.new); eventos = eventos.slice(0, 100); contarEvento(p.new);
      if (p.new.tipo === 'ok') sonar('ok'); if (p.new.tipo === 'error') sonar('error');
      renderLog(); recargarResumen();
    })
    .subscribe();
  setInterval(cargar, 5 * 60 * 1000); // respaldo por si se cae el realtime
}

/* ---------- Datos: DEMO ---------- */
function initDemo() {
  document.getElementById('demoTag').hidden = false;
  document.getElementById('sub').textContent = 'HPC · Datos simulados (quita ?demo de la URL para ver los reales)';
  const now = Date.now(), iso = ms => new Date(ms).toISOString();
  const base = [
    { robot: 'citas',       pc: 'HPCLPJCOTUC',    estado: 'trabajando', llamada: 'LLS21-558012', detalle: 'Cita 412 · equipo 1 · SKU 4521', intervalo_seg: 300 },
    { robot: 'guias',       pc: 'HPCPCLOGISTICA', estado: 'trabajando', llamada: 'LLS21-557465', detalle: 'Procesando', intervalo_seg: 180 },
    { robot: 'digitadores', pc: 'HPCLPJCOTUC',    estado: 'trabajando', llamada: 'LLS21-556758', detalle: 'Procesando', intervalo_seg: 180 },
    { robot: 'correos',     pc: 'HPCLPJCOTUC',    estado: 'trabajando', llamada: '89DC279B', detalle: 'Enviando autoconsumo_solicitud', intervalo_seg: 120 },
  ];
  base.forEach(b => status.set(key(b.robot, b.pc), { ...b, version: '1.0', last_seen: iso(now) }));
  base.forEach((b, i) => resumen.set(key(b.robot, b.pc), { ok_hoy: 3 + i * 2, errores_hoy: i === 1 ? 1 : 0 }));
  const TIPOS = ['autoconsumo_solicitud', 'autoconsumo_resuelto', 'garantia_taller', 'garantia_pendiente', 'garantia_resuelto'];
  for (let i = 0; i < 10; i++) {
    const ev = i % 2
      ? { robot: 'correos', pc: 'HPCLPJCOTUC', tipo: 'ok', llamada: 'AC' + (100 + i), mensaje: `${TIPOS[i % 5]} → usuario@hpc.com.gt`, created_at: iso(now - i * 300000) }
      : { robot: ['citas', 'guias', 'digitadores'][i % 3], pc: base[i % 3].pc, tipo: 'ok', llamada: 'LLS21-5570' + (10 + i), mensaje: null, created_at: iso(now - i * 300000) };
    eventos.push(ev); contarEvento(ev);
  }
  ultimaFirma = ''; quizasLayout(); renderCards(); renderLog();
  setInterval(() => {
    base.forEach(b => {
      const k = key(b.robot, b.pc), s = status.get(k), roll = Math.random();
      if (s.estado === 'trabajando' && roll < .5) {
        const ev = { robot: b.robot, pc: b.pc, tipo: 'ok', llamada: s.llamada, mensaje: b.robot === 'correos' ? s.detalle.replace('Enviando ', '') + ' → usuario@hpc.com.gt' : null, created_at: iso(Date.now()) };
        eventos.unshift(ev); contarEvento(ev); resumen.get(k).ok_hoy++; sonar('ok');
      }
      if (roll < .15) Object.assign(s, { estado: 'esperando', llamada: null, detalle: 'Sin pendientes' });
      else if (roll < .18 && b.robot === 'guias') Object.assign(s, { estado: 'error', ultimo_error: 'No apareció el botón Imprimir en el visor' });
      else Object.assign(s, { estado: 'trabajando', llamada: b.robot === 'correos' ? 'AC' + (100 + (Math.random() * 900 | 0)) : 'LLS21-55' + (7000 + (Math.random() * 999 | 0)),
        detalle: b.robot === 'correos' ? 'Enviando ' + TIPOS[Math.random() * 5 | 0] : 'Procesando' });
      s.last_seen = iso(Date.now());
    });
    eventos = eventos.slice(0, 100); renderCards(); renderLog();
  }, 9000);
}

setInterval(renderCards, 15000); // refresca "hace X" y detecta caídos
DEMO ? initDemo() : initSupabase().catch(e => { document.getElementById('sub').textContent = 'Error: ' + e.message; });
requestAnimationFrame(loop);
</script>
